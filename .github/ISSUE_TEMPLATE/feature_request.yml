name: Feature request
description: Suggest an idea or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: policy
    attributes:
      label: Content policy
      description: See CONTRIBUTING.md for the naming policy.
      options:
        - label: This idea does not use real club names, real player names, logos, photos or copied assets.
          required: true
